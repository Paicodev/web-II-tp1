name: Java CI con Maven

# Se dispara ante cualquier push o Pull Request a las ramas main o TP3
on:
  push:
    branches: [ "main", "TP3" ]
  pull_request:
    branches: [ "main", "TP3" ]

jobs:
  build:
    name: Compilar y Ejecutar Pruebas (Unitarias + Testcontainers)
    runs-on: ubuntu-latest

    # Servicio de PostgreSQL en el runner para soportar pruebas que busquen localhost:5432
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: webii_tp2
          POSTGRES_USER: webii_tp2
          POSTGRES_PASSWORD: webii_tp2
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Descarga el código del repositorio en la máquina virtual
      - name: Descargar repositorio (Checkout)
        uses: actions/checkout@v4

      # 2. Instala el JDK 25 configurando caché de dependencias Maven
      - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: maven

      # 3. Le da permisos de ejecución al wrapper de Maven en Linux
      - name: Dar permisos de ejecución a Maven Wrapper
        run: chmod +x mvnw

      # 4. Compila el proyecto y ejecuta toda la suite de pruebas
      - name: Ejecutar pruebas unitarias y de integración
        run: ./mvnw clean test
