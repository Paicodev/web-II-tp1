spring.application.name=demo
spring.jackson.deserialization.fail-on-null-for-primitives=false

# API externa que se va a consumir para el catálogo de productos
app.dummyjson.base-url=https://dummyjson.com

# Conexión a PostgreSQL, ahora con soporte a env vars
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webii_tp2}
spring.datasource.username=${DB_USERNAME:webii_tp2}
spring.datasource.password=${DB_PASSWORD:webii_tp2}

# Esquema y ciclo de vida de Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#Clave secreta para firmar los tokens JWT, por defecto es una clave de desarrollo
app.jwt.secret=${JWT_SECRET:MatiClaveSecretaSuperSegura2026Unvime}
#Tiempo de expiración del token en milisegundos, por defecto 1 hora
app.jwt.expiration=${JWT_EXPIRATION:3600000}

